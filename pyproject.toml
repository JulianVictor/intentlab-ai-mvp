[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlab-ai"
version = "0.1.0"
description = "Calibrated intent classification with abstention on a BANKING77 subset."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "JulianVictor" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added in the phase that first needs them (see docs/development_plan.md).
dependencies = [
    # Phase 2: baseline model. joblib is imported directly for artifact persistence.
    # scikit-learn is pinned to a minor series: defaults and pickles change between minors.
    "joblib>=1.4,<2",
    # Phase 2.2: imported directly by the evaluation bootstrap.
    "numpy>=2.0,<3",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.0,<3",
    "pytest>=9.0,<10",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentlab_ai = ["py.typed"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Neither package ships type information; their objects are typed as Any at our boundary.
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true
